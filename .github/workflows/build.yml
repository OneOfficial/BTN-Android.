name: Build BTN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract BTN project
        run: unzip -q BTN-Android-Prototype.zip

      - name: Build APK
        working-directory: BTN-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTN-debug-apk
          path: BTN-Android/app/build/outputs/apk/debug/app-debug.apk
